# =============================================================================
# Dimensity 820 (MT6875) Network Mod v2.0 — dhcpcd.conf
# EXCLUSIVE: Dimensity 820 · WiFi 6 2x2 · MT6631
# DHCP client optimization: fast connect, DNS override
# =============================================================================

# Rapid commit — 1 RTT vs 4 for DHCP
option rapid_commit

# Timeout tuning
timeout 10
reboot 2
retry 2

# Client identification
clientid
hostname

# DNS — Cloudflare (global anycast, low latency)
static domain_name_servers=1.1.1.1 1.0.0.1

# Request full routing options
require subnet_mask
option routers, classless_static_routes, interface_mtu
option domain_name_servers, ntp_servers, host_name

# MTU via DHCP
option interface_mtu

# Strip unnecessary options
nooption domain_search
nooption domain_name

# Skip ARP probe — saves 1-2s per connect (D820 WiFi 6 fast-assoc)
noarp
